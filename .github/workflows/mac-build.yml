name: Build Fafa for Mac

on:
  push:
    branches: [codex/mac-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Build Intel and Apple Silicon disk images
        run: pnpm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: fafa-mac-dmg
          path: release/*.dmg
          if-no-files-found: error
      - name: Add Mac downloads to v0.2.0 release
        run: gh release upload v0.2.0 release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

