<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fafa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="pet" aria-label="Fafa the desktop cat">
    <div id="bubble" role="status" aria-live="polite">Hi, I'm Fafa! 🐾</div>
    <button id="close" title="Quit Fafa" aria-label="Quit Fafa">×</button>
    <div id="cat" role="button" tabindex="0" aria-label="Pet Fafa">
      <img class="pose pose-sit" src="fafa-photo.png" alt="Fafa, a fluffy cream-white cat" draggable="false">
      <img class="pose pose-paw" src="fafa-paw-v2.png" alt="" draggable="false">
      <img class="pose pose-recline" src="fafa-recline.png" alt="" draggable="false">
    </div>
    <div id="controls" aria-label="Fafa actions">
      <button id="feed" title="Give Fafa a treat">🍣 <span>Feed</span></button>
      <button id="play" title="Play with Fafa">🧶 <span>Play</span></button>
      <button id="sleep" title="Let Fafa nap">💤 <span>Nap</span></button>
    </div>
    <p id="hint">Drag Fafa to move · click to pet</p>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
